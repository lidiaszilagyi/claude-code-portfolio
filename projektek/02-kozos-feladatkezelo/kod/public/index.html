<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Közös feladatok</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Elrendezés: felül a három ember „kinél van” sávja, alatta szűrők, majd lista vagy tábla. */
:root{
  --bg:#EDF1EF; --surface:#FBFCFB; --sunk:#E3E9E6; --ink:#17262A; --muted:#5B6C71; --line:#D2DAD6;
  --accent:#1B6E69; --accent-ink:#FFFFFF;
  --p1:#B23F68; --p2:#2A68AD; --p3:#6A52B3; --p0:#7C8A8E;
  --todo:#6B7B80; --doing:#B26A00; --done:#2E7D4F; --late:#C0392B;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111A1C; --surface:#1A2629; --sunk:#0C1315; --ink:#E6EEEC; --muted:#93A5A9; --line:#2C3B3F;
  --accent:#4FB8B0; --accent-ink:#06201E;
  --p1:#E583A6; --p2:#7DB2EE; --p3:#AC98EE; --p0:#8A9A9E;
  --todo:#9AAAAE; --doing:#E7A340; --done:#6CC592; --late:#F0806F;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--done)}
.sync.busy i{background:var(--doing)} .sync.err i{background:var(--late)}
.me{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--late)}
select,input[type=text],input[type=date],input[type=search],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}

/* Kinél van */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.who button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-left:5px solid var(--pc)}
.who button[aria-pressed=true]{background:color-mix(in srgb,var(--pc) 13%,var(--surface));border-color:var(--pc)}
.who .n{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--pc);min-width:1.2em}
.who .nm{font-weight:700}
.who .sub{font-size:12.5px;color:var(--muted)}
.sec-label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 -8px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=search]{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.spacer{flex:1 1 0}

.av{width:26px;height:26px;border-radius:50%;background:var(--pc);color:#fff;display:inline-grid;place-items:center;
  font-size:11.5px;font-weight:700;flex:none}
@media (prefers-color-scheme:dark){.av{color:#10191B}}
.owner{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--pc);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;
  background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.high{background:color-mix(in srgb,var(--late) 16%,transparent);color:var(--late)}
.chip.low{opacity:.8}
.chip.late{background:var(--late);color:#fff}
.chip.ask{background:var(--doing);color:#fff}
.chip.shared{background:color-mix(in srgb,var(--p3) 18%,transparent);color:var(--p3)}
.btn[aria-pressed=true]{background:var(--p3);border-color:var(--p3);color:#fff}
.sharebox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.sharebox.on{border-color:var(--p3);background:color-mix(in srgb,var(--p3) 10%,var(--surface))}
.sharenote{font-size:13px;color:var(--muted)} .sharebox.on .sharenote{color:var(--ink);font-weight:600}
.dlg label.chk{flex-direction:row;align-items:flex-start;gap:9px;font-weight:400;font-size:13.5px}
.dlg label.chk input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.dlg label.chk span{font-size:13.5px;color:var(--muted)} .dlg label.chk b{color:var(--ink)}
.askbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-left:4px solid var(--doing)}
.hist{border-top:1px solid var(--line);padding-top:12px}
.hist summary{cursor:pointer;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border-bottom:0}
.lg>span:first-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
span.t{font-weight:600;overflow-wrap:anywhere}
.st{--sc:var(--todo)} .st.doing{--sc:var(--doing)} .st.done{--sc:var(--done)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.todo .dot{background:none;border:2px solid var(--sc)}

/* Lista */
.group h2{font:700 15px var(--body);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.group h2 small{font-weight:600;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:22px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px 14px;align-items:center;
  padding:10px 14px;border-top:1px solid var(--line);border-left:4px solid var(--pc)}
.row:first-child{border-top:0}
.row .main{display:flex;gap:11px;align-items:flex-start;min-width:0}
.row .main>div{min-width:0}
.tick{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;margin:1px 0 0;border:2px solid var(--muted);border-radius:6px;
  background:var(--surface);cursor:pointer;display:grid;place-items:center}
.tick:hover{border-color:var(--done)}
.tick:disabled{opacity:.4;cursor:not-allowed}
.row select:disabled{opacity:.75;cursor:not-allowed;background:var(--sunk)}
.card[draggable=false]{cursor:default}
.fs{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:14px}
.fs:disabled{opacity:.8}
.lock{background:var(--sunk);border-radius:8px;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tick:checked{background:var(--done);border-color:var(--done)}
.tick:checked::after{content:"";width:10px;height:5px;border:solid var(--surface);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translateY(-1px)}
.arch{grid-template-columns:minmax(0,1fr) auto auto}
.arch .by{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .t{background:none;border:0;padding:0;text-align:left;font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .t:hover{text-decoration:underline}
.row.is-done .t{color:var(--muted)}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.row select{padding:5px 8px;font-size:13.5px;font-weight:600}
.row select.osel{color:var(--pc);border-color:color-mix(in srgb,var(--pc) 45%,var(--line))}
.row select.ssel{color:var(--sc)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .row{grid-template-columns:1fr 1fr}
  .row .main{grid-column:1/-1}
  .arch{grid-template-columns:1fr auto}
  .row select{width:100%}
}

/* Tábla */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;
  border-top:4px solid var(--sc)}
.col.over{outline:2px dashed var(--sc);outline-offset:-4px}
.col h2{font:700 14px var(--body);margin:2px 4px 4px;display:flex;justify-content:space-between;color:var(--sc)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:8px;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;cursor:grab}
.card:hover{border-color:var(--muted);border-left-color:var(--pc)}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .ct{font-weight:600;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;min-width:0}
.card .ct:hover{text-decoration:underline}
.card.is-done .ct{color:var(--muted)}
.card .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.card .chips{display:flex;flex-wrap:wrap;gap:5px}
.col .add{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;color:var(--muted);font-weight:600}

/* Párbeszédablak */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:0;
  width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgb(8 14 16/.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h3{font:700 19px var(--display);margin:0}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.dlg label>*{font-size:15px;font-weight:400;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{flex-direction:row;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  border-radius:99px;padding:6px 12px 6px 7px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--pc,var(--sc));background:color-mix(in srgb,var(--pc,var(--sc)) 16%,var(--surface));
  box-shadow:inset 0 0 0 1px var(--pc,var(--sc))}
.pick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pick label>*{font-size:inherit;font-weight:inherit}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.comments{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.comments h4{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;border-left:3px solid var(--pc)}
.cm .h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.cm .h b{color:var(--pc)}
.cm p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmform{display:flex;gap:8px;align-items:flex-end}
.confirm{font-size:13.5px;color:var(--late);font-weight:600}
.welcome p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card,.row,.btn{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Közös feladatok</h1>
      <div class="sync" id="sync"><i></i><span>Betöltés…</span></div>
    </div>
    <div class="me">
      <span>Belépve: <b id="meName" style="color:var(--ink)">…</b></span>
      <button class="btn ghost" id="outBtn" title="Másik kóddal lépsz be ezen az eszközön">Kilépés</button>
      <button class="btn ghost" id="namesBtn" title="A három név átírása" hidden>Nevek</button>
      <button class="btn" id="pushBtn" hidden>Értesítések bekapcsolása</button>
    </div>
  </header>

  <p class="sec-label">Kinél van most</p>
  <section class="who" id="who" aria-label="Kinél van most"></section>

  <div class="bar">
    <div class="seg" role="group" aria-label="Nézet">
      <button id="vList" aria-pressed="true">Lista</button>
      <button id="vBoard" aria-pressed="false">Tábla</button>
      <button id="vArch" aria-pressed="false">Archívum</button>
    </div>
    <input type="search" id="q" placeholder="Keresés…" aria-label="Keresés">
    <select id="catF" aria-label="Kategória szűrő"></select>
    <button class="btn" id="rBtn" aria-pressed="false" hidden>Mit lát …?</button>
    <button class="btn primary" id="newBtn">+ Új feladat</button>
  </div>

  <main id="view"><div class="rows"><div class="empty">Betöltés…</div></div></main>
</div>

<dialog id="dlg"></dialog>

<script>
const ST = {todo:"Teendő", doing:"Folyamatban", done:"Lezárt"};
const PR = {high:"Sürgős", mid:"Normál", low:"Ráér"};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ls = { get(k){ try{ return localStorage.getItem(k) }catch{ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch{} } };

let board = null;
let me = "";   // a szerver mondja meg a belépőkód alapján
let view = ["list","board","archive"].includes(ls.get("view")) ? ls.get("view") : "list";
let ownerF = "";          // "" = mindenki, "p1".., "none" = gazdátlan
let openId = null;        // a megnyitott feladat
let queue = Promise.resolve();

/* ---------- szinkron ---------- */
function setSync(state, text){ const el = $("#sync"); el.className = "sync " + state; $("span", el).textContent = text; }
let kod = ls.get("kod") || "";
{ // a kódot linkben is át lehet adni: …/#kod=xxxx
  const m = /^#kod=(.+)$/.exec(location.hash);
  if(m){ kod = decodeURIComponent(m[1]).trim(); ls.set("kod", kod); history.replaceState(null, "", location.pathname); }
}
function api(path, opt = {}){
  return fetch(path, {cache:"no-store", ...opt, headers:{...(opt.body ? {"content-type":"application/json"} : {}), "x-kod": kod}})
    .then(r => { if(r.status === 401){ askCode(kod ? "Ez a kód nem jó. Próbáld újra." : ""); throw new Error("kod"); } return r; });
}
let codeOpen = false;
function askCode(msg){
  if(codeOpen) return; codeOpen = true;
  const d = $("#dlg");
  d.innerHTML = `<form class="dlg welcome" method="dialog" id="kf">
    <h3>Belépőkód</h3>
    <p>Mindenkinek saját kódja van, ebből tudja az oldal, ki vagy. Ezen az eszközön csak egyszer kell megadnod.</p>
    ${msg ? `<div class="confirm">${esc(msg)}</div>` : ""}
    <label>Kód<input type="text" id="kodIn" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
    <div class="actions"><button class="btn primary">Belépés</button></div>
  </form>`;
  $("#kf").onsubmit = () => { kod = $("#kodIn").value.trim(); ls.set("kod", kod); codeOpen = false; start(); };
  d.addEventListener("cancel", e => { if(codeOpen) e.preventDefault(); }, {once:true});
  if(!d.open) d.showModal();
  $("#kodIn").focus();
}
async function load(){
  const r = await api("/api/board");
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function send(ops){
  setSync("busy", "Mentés…");
  queue = queue.then(async () => {
    try{
      const r = await api("/api/board", {method:"POST", body:JSON.stringify({ops: ops.map(o => ({...o, by: me}))})});
      if(!r.ok) throw new Error(r.status);
      board = await r.json(); me = board.me; render(); setSync("", "Mentve");
    }catch(e){ setSync("err", "Nem sikerült menteni. Ellenőrizd a netet, majd próbáld újra."); }
  });
  return queue;
}
async function refresh(){
  try{
    const b = await load();
    if(!board || b.rev !== board.rev){ board = b; me = b.me; render(); if(openId){ renderComments(); renderLog(); } }
    if(!$("#sync").classList.contains("busy")) setSync("", "Naprakész · " + new Date().toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){ if(e.message !== "kod") setSync("err", "Nincs kapcsolat a közös listával."); }
}
/* helyi azonnali módosítás + mentés */
function patch(id, fields){
  const t = board.tasks.find(x => x.id === id);
  if(t && !canManage(t)){ render(); return; }
  if(t){ Object.assign(t, fields); render(); }
  return send([{type:"upsert", task:{id, ...fields}}]);
}

/* státuszváltás: lezáráskor feljegyezzük, ki zárta le */
function setStatus(id, status){
  const f = {status};
  if(status === "done"){ f.closedBy = me; f.closedAt = Date.now(); }
  return patch(id, f);
}

/* ---------- segédek ---------- */
const live = () => board.tasks.filter(t => !t.deleted);
const person = id => board.people.find(p => p.id === id);
const seenByR = t => t.owner === "p3" || t.shared === true;   // amit a korlátozott néző (p3) lát
let onlyR = false;                                            // „Mit lát …?” szűrő
const canManage = t => !person(t.owner) || t.owner === me;
const lockNote = t => `Ez a feladat ${pname(t.owner)} nevén van, csak ő módosíthatja.`;
const pname = id => person(id)?.name || "Nincs gazdája";
const pc = id => `--pc:var(--${person(id) ? id : "p0"})`;
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
function dueChip(t){
  if(!t.due) return "";
  const late = t.status !== "done" && t.due < today();
  const d = new Date(t.due + "T00:00").toLocaleDateString("hu-HU", {month:"short", day:"numeric"});
  return `<span class="chip ${late ? "late" : ""}">${late ? "Lejárt · " : ""}${esc(d)}</span>`;
}
function chips(t){
  return [
    t.prio !== "mid" ? `<span class="chip ${t.prio}">${PR[t.prio]}</span>` : "",
    dueChip(t),
    t.cat ? `<span class="chip">${esc(t.cat)}</span>` : "",
    t.comments.length ? `<span class="chip" title="Megjegyzések">💬 ${t.comments.length}</span>` : "",
    me !== "p3" && t.shared === true && t.owner !== "p3" ? `<span class="chip shared" title="${esc(pname("p3"))} is látja ezt a feladatot, a leírásával és a megjegyzéseivel együtt">Megosztva: ${esc(pname("p3"))}</span>` : "",
    t.ask ? `<span class="chip ask" title="${esc(t.ask.text)}">Kérés: ${esc(person(t.ask.by)?.name || "valaki")}</span>` : "",
  ].join("");
}
function ownerTag(id){
  const p = person(id);
  return `<span class="owner" style="${pc(id)}"><span class="av">${p ? esc(initials(p.name)) : "?"}</span>${esc(pname(id))}</span>`;
}
function visible(){
  const q = $("#q").value.trim().toLowerCase(), cat = $("#catF").value;
  const pr = {high:0, mid:1, low:2};
  return live().filter(t =>
    (!ownerF || (ownerF === "none" ? !person(t.owner) : t.owner === ownerF)) &&
    (!cat || t.cat === cat) && (!onlyR || seenByR(t)) &&
    (!q || (t.title + " " + t.desc + " " + t.cat).toLowerCase().includes(q))
  ).sort((a,b) => pr[a.prio]-pr[b.prio] || (a.due||"9").localeCompare(b.due||"9") || a.createdAt-b.createdAt);
}

/* ---------- megjelenítés ---------- */
function render(){
  if(!board) return;
  $("#meName").textContent = pname(me);
  $("#namesBtn").hidden = me !== "p1";
  $("#rBtn").hidden = me === "p3"; $("#rBtn").textContent = `Mit lát ${pname("p3")}?`; $("#rBtn").setAttribute("aria-pressed", onlyR);
  // Kinél van
  const open = live().filter(t => t.status !== "done");
  const tiles = board.people.map(p => ({id:p.id, name:p.name, list:open.filter(t => t.owner === p.id)}));
  const orphans = open.filter(t => !person(t.owner));
  if(orphans.length || ownerF === "none") tiles.push({id:"none", name:"Nincs gazdája", list:orphans});
  $("#who").innerHTML = tiles.map(x => {
    const doing = x.list.filter(t => t.status === "doing").length;
    return `<button data-owner="${x.id}" aria-pressed="${ownerF===x.id}" style="${pc(x.id)}">
      <span class="n">${x.list.length}</span>
      <span><span class="nm">${esc(x.name)}${x.id===me ? " (én)" : ""}</span><br>
      <span class="sub">${x.list.length ? `nyitott feladat · ${doing} folyamatban` : (me === "p3" && x.id !== me ? "nincs számodra látható feladata" : "nincs nála nyitott feladat")}</span></span></button>`;
  }).join("");
  // kategóriák
  const cats = [...new Set(live().map(t => t.cat).filter(Boolean))].sort((a,b) => a.localeCompare(b,"hu"));
  const curCat = $("#catF").value;
  $("#catF").innerHTML = `<option value="">Minden kategória</option>` + cats.map(c => `<option ${c===curCat?"selected":""}>${esc(c)}</option>`).join("");
  $("#vList").setAttribute("aria-pressed", view === "list");
  $("#vBoard").setAttribute("aria-pressed", view === "board");
  $("#vArch").setAttribute("aria-pressed", view === "archive");
  $("#vArch").textContent = "Archívum (" + live().filter(t => t.status === "done").length + ")";

  const tasks = visible();
  if(!board.tasks.length){
    $("#view").innerHTML = `<div class="rows"><div class="empty"><b>Még nincs feladat.</b><br>Az „Új feladat” gombbal veheted fel az elsőt. Amit itt rögzítesz, azt a másik két ember is azonnal látja.</div></div>`;
    return;
  }
  $("#view").innerHTML = view === "list" ? listHTML(tasks) : view === "board" ? boardHTML(tasks) : archHTML(tasks);
}
function listHTML(tasks){
  const out = ["doing","todo"].map(s => {
    const g = tasks.filter(t => t.status === s);
    if(!g.length) return "";
    return `<section class="group st ${s}"><h2><span class="dot"></span>${ST[s]} <small>${g.length}</small></h2><div class="rows">` + g.map(t => `
      <div class="row st ${t.status} ${t.status==="done"?"is-done":""}" style="${pc(t.owner)}">
        <div class="main"><input type="checkbox" class="tick" data-tick="${t.id}" aria-label="Lezárás: ${esc(t.title)}" ${canManage(t) ? `title="Kipipálva az archívumba kerül"` : `disabled title="${esc(lockNote(t))}"`}>
          <div><button class="t" data-open="${t.id}">${esc(t.title)}</button><div class="meta">${chips(t)}</div></div></div>
        <select class="osel" data-owner-of="${t.id}" aria-label="Kinél van" ${canManage(t) ? "" : `disabled title="${esc(lockNote(t))}"`}>
          <option value="">Nincs gazdája</option>${board.people.map(p => `<option value="${p.id}" ${p.id===t.owner?"selected":""}>${esc(p.name)}</option>`).join("")}
        </select>
        <select class="ssel" data-status-of="${t.id}" aria-label="Státusz" ${canManage(t) ? "" : `disabled title="${esc(lockNote(t))}"`}>
          ${Object.keys(ST).map(k => `<option value="${k}" ${k===t.status?"selected":""}>${ST[k]}</option>`).join("")}
        </select>
      </div>`).join("") + `</div></section>`;
  }).join("");
  return `<div class="list">${out || `<div class="rows"><div class="empty">Nincs nyitott feladat ebben a szűrésben. A lezártakat az Archívumban találod.</div></div>`}</div>`;
}
function archHTML(tasks){
  const g = tasks.filter(t => t.status === "done").sort((a,b) => (b.closedAt||0) - (a.closedAt||0));
  const bin = board.tasks.filter(t => t.deleted).sort((a,b) => b.deleted.at - a.deleted.at);
  const tools = `<div class="bar"><button class="btn" id="expBtn">Exportálás Excelbe</button><span class="sub" style="color:var(--muted);font-size:13px">Minden feladat egy táblázatban, a lezártakkal együtt.</span></div>`;
  const trash = bin.length ? `<section class="group"><h2>Lomtár <small>${bin.length} · 30 nap után végleg törlődik</small></h2><div class="rows">` + bin.map(t => `
    <div class="row arch is-done" style="${pc(t.owner)}">
      <div class="main"><div><span class="t">${esc(t.title)}</span><div class="meta">${chips(t)}</div></div></div>
      <div class="by">Törölte: ${esc(person(t.deleted.by)?.name || "Ismeretlen")} · ${new Date(t.deleted.at).toLocaleDateString("hu-HU",{month:"short",day:"numeric"})}</div>
      <button class="btn" data-restore="${t.id}" ${canManage(t) ? "" : `disabled title="${esc(lockNote(t))}"`}>Visszaállítás</button>
    </div>`).join("") + `</div></section>` : "";
  if(!g.length) return `<div class="list">${tools}<div class="rows"><div class="empty">Az archívum üres. Ide kerül minden kipipált feladat, azzal együtt, hogy ki zárta le.</div></div>${trash}</div>`;
  return `<div class="list">${tools}<section class="group st done"><h2><span class="dot"></span>Lezárt feladatok <small>${g.length}</small></h2><div class="rows">` + g.map(t => `
    <div class="row arch is-done" style="${pc(t.closedBy)}">
      <div class="main"><input type="checkbox" class="tick" checked data-untick="${t.id}" aria-label="Visszanyitás: ${esc(t.title)}" ${canManage(t) ? `title="A pipa kivételével visszakerül a nyitottak közé"` : `disabled title="${esc(lockNote(t))}"`}>
        <div><button class="t" data-open="${t.id}">${esc(t.title)}</button><div class="meta">${chips(t)}</div></div></div>
      <div class="by">Lezárta: ${ownerTag(t.closedBy).replace("Nincs gazdája","Ismeretlen")}</div>
      <div class="by">${t.closedAt ? new Date(t.closedAt).toLocaleString("hu-HU",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : ""}</div>
    </div>`).join("") + `</div></section>${trash}</div>`;
}
/* ---------- export ---------- */
function exportCsv(){
  const dt = v => v ? new Date(v).toLocaleString("hu-HU") : "";
  const cell = v => { let x = String(v ?? ""); if(/^[=+\-@]/.test(x)) x = "'" + x; return '"' + x.replace(/"/g, '""') + '"'; };
  const head = ["Megnevezés","Státusz","Kinél van","Határidő","Prioritás","Kategória","Létrehozta","Létrehozva","Lezárta","Lezárva","Megjegyzések","Leírás"];
  const rows = live().map(t => [t.title, ST[t.status], person(t.owner)?.name || "", t.due, PR[t.prio], t.cat, person(t.createdBy)?.name || "", dt(t.createdAt),
    t.status === "done" ? (person(t.closedBy)?.name || "") : "", t.status === "done" ? dt(t.closedAt) : "",
    t.comments.map(c => `${person(c.by)?.name || "?"}: ${c.text}`).join(" | "), t.desc]);
  const csv = "﻿" + [head, ...rows].map(r => r.map(cell).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "kozos-feladatok-" + today() + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function boardHTML(tasks){
  return `<div class="board">` + ["todo","doing"].map(s => {
    const g = tasks.filter(t => t.status === s);
    return `<section class="col st ${s}" data-col="${s}"><h2><span>${ST[s]}</span><span>${g.length}</span></h2>` + g.map(t => `
      <div class="card" draggable="${canManage(t)}" data-card="${t.id}" style="${pc(t.owner)}">
        <span class="top"><input type="checkbox" class="tick" data-tick="${t.id}" aria-label="Lezárás: ${esc(t.title)}" ${canManage(t) ? `title="Kipipálva az archívumba kerül"` : `disabled title="${esc(lockNote(t))}"`}>
          <button class="ct" data-open="${t.id}">${esc(t.title)}</button></span>
        <span class="foot">${ownerTag(t.owner)}<span class="chips">${chips(t)}</span></span>
      </div>`).join("") + `<button class="add" data-new="${s}">+ Új ide</button></section>`;
  }).join("") + `</div>`;
}

/* ---------- feladat ablak ---------- */
function openTask(id, preset = {}){
  const isNew = !id;
  const t = isNew ? {id:uid(), title:"", desc:"", status:"todo", owner:me, due:"", prio:"mid", cat:"", comments:[], ...preset} : board.tasks.find(x => x.id === id);
  if(!t) return;
  openId = isNew ? null : t.id;
  const cats = [...new Set(live().map(x => x.cat).filter(Boolean))];
  const d = $("#dlg");
  const locked = !isNew && !canManage(t);
  d.innerHTML = `<form class="dlg" method="dialog" id="tf">
    <h3>${isNew ? "Új feladat" : "Feladat"}</h3>
    ${t.status === "done" ? `<div class="by" style="color:var(--muted)">Lezárta: ${ownerTag(t.closedBy).replace("Nincs gazdája","Ismeretlen")}</div>` : ""}
    ${locked ? `<div class="lock">${esc(lockNote(t))} Megjegyzést írhatsz hozzá, vagy kérést küldhetsz neki:
      <span class="pick" style="margin-top:8px">${["Kész a részem, nézd meg", "Kérlek, add át nekem", "Elakadtam, segíts"].map(x => `<button class="btn" type="button" data-ask="${esc(x)}">${esc(x)}</button>`).join("")}</span></div>` : ""}
    ${!isNew && !locked && t.ask ? `<div class="lock askbox">Kérés tőle: ${esc(person(t.ask.by)?.name || "valaki")} · „${esc(t.ask.text)}” <button class="btn" type="button" id="ackBtn">Láttam</button></div>` : ""}
    <fieldset class="fs" ${locked ? "disabled" : ""}>
    <label>Megnevezés<input type="text" id="fTitle" maxlength="200" required value="${esc(t.title)}"></label>
    <label>Kinél van
      <span class="pick">${[...board.people, {id:"", name:"Nincs gazdája"}].map(p => `<label style="${pc(p.id)}">
        <input type="radio" name="fOwner" value="${p.id}" ${p.id===(person(t.owner)?t.owner:"")?"checked":""}>
        <span class="av">${p.id ? esc(initials(p.name)) : "?"}</span>${esc(p.name)}</label>`).join("")}</span></label>
    <label>Státusz
      <span class="pick">${Object.keys(ST).map(k => `<label class="st ${k}">
        <input type="radio" name="fStatus" value="${k}" ${k===t.status?"checked":""}><span class="dot"></span>${ST[k]}</label>`).join("")}</span></label>
    <div class="grid2">
      <label>Határidő<input type="date" id="fDue" value="${esc(t.due)}"></label>
      <label>Prioritás<select id="fPrio">${Object.keys(PR).map(k => `<option value="${k}" ${k===t.prio?"selected":""}>${PR[k]}</option>`).join("")}</select></label>
    </div>
    <label>Kategória<input type="text" id="fCat" maxlength="40" list="catList" placeholder="pl. Számlázás" value="${esc(t.cat)}">
      <datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></label>
    <label>Leírás<textarea id="fDesc" rows="3" maxlength="4000">${esc(t.desc)}</textarea></label>
    </fieldset>
    ${me === "p3" ? "" : `<div class="sharebox" id="shareBox">
      <label class="chk"><input type="checkbox" id="fShare" ${t.shared === true ? "checked" : ""} ${isNew || me === "p1" || !locked ? "" : "disabled"}><span><b>Megosztom vele: ${esc(pname("p3"))}</b></span></label>
      <div class="sharenote" id="shareNote"></div></div>`}
    <div class="actions">
      ${locked ? "" : `<button class="btn primary" value="save">Mentés</button>`}
      <button class="btn" type="button" id="fCancel">${locked ? "Bezárás" : "Mégse"}</button>
      <span class="spacer"></span>
      ${isNew || locked ? "" : `<span class="confirm" id="delAsk" hidden>A lomtárba kerül, 30 napig visszaállítható.</span><button class="btn ghost danger" type="button" id="fDel">Törlés</button>`}
    </div>
    ${isNew ? "" : `<div class="comments"><h4>Megjegyzések</h4><div id="cmList" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="cmform"><textarea id="cmText" rows="2" maxlength="2000" placeholder="Írj megjegyzést…" aria-label="Új megjegyzés"></textarea>
      <button class="btn" type="button" id="cmSend">Küldés</button></div></div>
      <details class="hist"><summary>Előzmények</summary><div id="logList"></div></details>`}
  </form>`;
  $("#tf").onsubmit = e => {
    if(locked){ e.preventDefault(); return; }
    const f = {
      title: $("#fTitle").value.trim(), desc: $("#fDesc").value, due: $("#fDue").value, prio: $("#fPrio").value,
      cat: $("#fCat").value.trim(), owner: $("input[name=fOwner]:checked", d)?.value || "", status: $("input[name=fStatus]:checked", d)?.value || "todo",
    };
    if($("#fShare") && isNew) f.shared = $("#fShare").checked;
    if(f.status === "done" && t.status !== "done"){ f.closedBy = me; f.closedAt = Date.now(); }
    if(isNew){
      const nt = {...t, ...f, createdAt:Date.now(), createdBy:me};
      board.tasks.push(nt); render();
      send([{type:"upsert", task:{id:nt.id, createdBy:me, ...f}}]);
    } else patch(t.id, f);
    openId = null;
  };
  $("#fCancel").onclick = () => { openId = null; d.close(); };
  if($("#fShare")){
    const note = () => {
      const toR = $("input[name=fOwner]:checked", d)?.value === "p3", sh = $("#fShare").checked, R = pname("p3");
      $("#shareBox").classList.toggle("on", toR || sh);
      $("#shareNote").textContent = toR ? `Ha ${R} nevére teszed, ${R} látni fogja: a megnevezést, a leírást, minden megjegyzést és az előzményeket.`
        : sh ? `${R} látja ezt a feladatot: a megnevezést, a leírást, minden megjegyzést és az előzményeket.`
        : `${R} nem látja ezt a feladatot, és azt sem tudja, hogy létezik.`;
    };
    d.querySelectorAll("input[name=fOwner]").forEach(r => r.addEventListener("change", note));
    $("#fShare").addEventListener("change", () => {
      note();
      if(!isNew){ t.shared = $("#fShare").checked; render(); send([{type:"share", id:t.id, shared:t.shared}]).then(renderLog); }
    });
    note();
  }
  if(!isNew){
    let armed = false;
    if($("#fDel")) $("#fDel").onclick = () => {
      if(!armed){ armed = true; $("#delAsk").hidden = false; $("#fDel").textContent = "Igen, mehet a lomtárba"; return; }
      t.deleted = {at:Date.now(), by:me}; render();
      send([{type:"delete", id:t.id}]); openId = null; d.close();
    };
    $("#cmSend").onclick = () => {
      const text = $("#cmText").value.trim(); if(!text) return;
      const c = {id:uid(), by:me, text, at:Date.now()};
      t.comments.push(c); $("#cmText").value = ""; renderComments(); render();
      send([{type:"comment", id:t.id, comment:c}]);
    };
    d.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => {
      const c = {id:uid(), by:me, text:b.dataset.ask, at:Date.now(), ask:true};
      t.comments.push(c); t.ask = {by:me, at:c.at, text:c.text}; renderComments(); render();
      send([{type:"ask", id:t.id, comment:c}]).then(renderLog);
      d.querySelectorAll("[data-ask]").forEach(x => x.disabled = true); b.textContent = "Elküldve ✓";
    });
    if($("#ackBtn")) $("#ackBtn").onclick = () => { delete t.ask; $("#ackBtn").closest(".askbox").hidden = true; render(); send([{type:"ackask", id:t.id}]); };
    renderComments(); renderLog();
  }
  d.showModal();
  if(isNew) $("#fTitle").focus();
}
function renderComments(){
  const el = $("#cmList"), t = board.tasks.find(x => x.id === openId);
  if(!el || !t) return;
  el.innerHTML = t.comments.length ? t.comments.map(c => `<div class="cm" style="${pc(c.by)}"><div class="h"><b>${esc(person(c.by)?.name || "Névtelen")}${c.ask ? " · kérés" : ""}</b>
    <span>${new Date(c.at).toLocaleString("hu-HU",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span></div><p>${esc(c.text)}</p></div>`).join("")
    : `<div class="sub" style="color:var(--muted);font-size:13.5px">Még nincs megjegyzés.</div>`;
}
function renderLog(){
  const el = $("#logList"), t = board.tasks.find(x => x.id === openId);
  if(!el || !t) return;
  const log = t.log || [];
  el.innerHTML = log.length ? log.slice().reverse().map(l => `<div class="lg"><span>${new Date(l.at).toLocaleString("hu-HU",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
    <span><b style="${pc(l.by)};color:var(--pc)">${esc(person(l.by)?.name || "Ismeretlen")}</b> ${esc(l.text)}</span></div>`).join("")
    : `<div class="lg"><span></span><span>Ennél a feladatnál még nincs rögzített előzmény.</span></div>`;
}
$("#dlg").addEventListener("close", () => { openId = null; });

/* ---------- reggeli értesítés ---------- */
const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64 = k => Uint8Array.from(atob(k.replace(/-/g,"+").replace(/_/g,"/")), c => c.charCodeAt(0));
async function pushState(){
  const btn = $("#pushBtn");
  if(!pushOK){ btn.hidden = false; btn.disabled = true; btn.textContent = "Értesítés itt nem elérhető"; btn.title = "iPhone-on előbb tedd az oldalt a kezdőképernyőre (Megosztás → Főképernyőhöz adás), majd ott nyisd meg."; return null; }
  const reg = await navigator.serviceWorker.register("/sw.js");
  const sub = await reg.pushManager.getSubscription();
  btn.hidden = false;
  btn.textContent = sub ? "Értesítések: bekapcsolva" : "Értesítések bekapcsolása";
  btn.title = sub ? "Értesítést kapsz, ha feladat kerül a nevedre, megjegyzést vagy kérést írnak hozzá, és reggel 7-kor összefoglalót. Kattints a kikapcsoláshoz." : "Azonnali értesítés, ha feladat kerül a nevedre vagy írnak hozzá, plusz reggel 7-kor összefoglaló.";
  return {reg, sub};
}
async function savePush(sub){ return api("/api/push", {method:"POST", body:JSON.stringify({person:me, subscription:sub})}); }
$("#pushBtn").onclick = async () => {
  try{
    const st = await pushState(); if(!st) return;
    if(st.sub){
      await api("/api/push", {method:"DELETE", body:JSON.stringify({subscription:st.sub})});
      await st.sub.unsubscribe(); await pushState(); return;
    }
    if(await Notification.requestPermission() !== "granted"){ setSync("err", "Az értesítést a böngésző letiltotta. A címsor melletti lakat ikonnál engedélyezheted."); return; }
    const {publicKey} = await (await api("/api/push")).json();
    const sub = await st.reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(publicKey)});
    const r = await savePush(sub); if(!r.ok) throw new Error(r.status);
    await pushState(); setSync("", "Értesítések bekapcsolva ezen az eszközön.");
  }catch(e){ setSync("err", "Nem sikerült bekapcsolni az értesítést."); }
};

/* ---------- események ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-open],[data-new],[data-owner],[data-restore],#expBtn"); if(!b) return;
  if(b.id === "expBtn") exportCsv();
  else if(b.dataset.restore){ const t = board.tasks.find(x => x.id === b.dataset.restore); if(t){ delete t.deleted; render(); send([{type:"restore", id:t.id}]); } }
  else if(b.dataset.open) openTask(b.dataset.open);
  else if(b.dataset.new) openTask(null, {status:b.dataset.new});
  else { ownerF = ownerF === b.dataset.owner ? "" : b.dataset.owner; render(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.ownerOf){
    const t = board.tasks.find(x => x.id === el.dataset.ownerOf);
    // nem megosztott feladat a korlátozott néző (p3) nevére: előbb megmutatjuk, mit fog látni
    if(el.value === "p3" && t && !seenByR(t)){ render(); openTask(t.id); const r = $('input[name=fOwner][value="p3"]', $("#dlg")); if(r){ r.checked = true; r.dispatchEvent(new Event("change")); } }
    else patch(el.dataset.ownerOf, {owner: el.value});
  }
  else if(el.dataset.statusOf) setStatus(el.dataset.statusOf, el.value);
  else if(el.dataset.tick) setStatus(el.dataset.tick, "done");
  else if(el.dataset.untick) setStatus(el.dataset.untick, "todo");
  else if(el.id === "catF") render();
});
$("#q").addEventListener("input", render);
$("#newBtn").onclick = () => openTask(null);
$("#rBtn").onclick = () => { onlyR = !onlyR; render(); };
$("#namesBtn").onclick = () => openNames(false);
$("#outBtn").onclick = () => { kod = ""; ls.set("kod", ""); board = null; me = ""; $("#meName").textContent = "…"; $("#who").innerHTML = ""; start(); };
$("#vList").onclick = () => { view = "list"; ls.set("view", view); render(); };
$("#vBoard").onclick = () => { view = "board"; ls.set("view", view); render(); };
$("#vArch").onclick = () => { view = "archive"; ls.set("view", view); render(); };
// húzás az oszlopok között
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest?.("[data-card]"); if(c){ dragId = c.dataset.card; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); } });
document.addEventListener("dragover", e => { const c = e.target.closest?.("[data-col]"); if(c && dragId){ e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== c && x.classList.remove("over")); c.classList.add("over"); } });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });
document.addEventListener("drop", e => {
  const c = e.target.closest?.("[data-col]"); if(!c || !dragId) return; e.preventDefault();
  const t = board.tasks.find(x => x.id === dragId); if(t && t.status !== c.dataset.col) patch(dragId, {status:c.dataset.col});
  dragId = null;
});

/* Teams-fülként megnyitva jelezzük a Teamsnek, hogy az oldal betöltött. */
if(window.parent !== window){
  const ts = document.createElement("script");
  ts.src = "https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js";
  ts.onload = () => { try{ microsoftTeams.app.initialize().then(() => microsoftTeams.app.notifySuccess()).catch(() => {}); }catch{} };
  document.head.appendChild(ts);
}

/* ---------- indulás ---------- */
async function start(){
  try{ board = await load(); me = board.me; render(); setSync("", "Naprakész"); pushState().then(st => st?.sub && savePush(st.sub)).catch(() => {}); }
  catch(e){
    if(e.message === "kod"){ setSync("err", "Belépőkód szükséges."); $("#view").innerHTML = `<div class="rows"><div class="empty">A lista megnyitásához add meg a közös belépőkódot.</div></div>`; return; }
    setSync("err", "Nem sikerült betölteni a közös listát. Frissítsd az oldalt."); $("#view").innerHTML = `<div class="rows"><div class="empty">Nem sikerült betölteni a közös listát.</div></div>`;
  }
}
start();
setInterval(() => { if(!document.hidden && board && !codeOpen) refresh(); }, 8000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && board && !codeOpen) refresh(); });
</script>
